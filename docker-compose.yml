services:
  api:
    build: .
    container_name: refinery-mass-balance
    ports:
      - "4005:4004"
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4004/', r => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
