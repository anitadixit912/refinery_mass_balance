<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Refinery Mass Balance | Agentic AI</title>
<script id="sap-ui-bootstrap"
  src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
  data-sap-ui-theme="sap_horizon"
  data-sap-ui-libs="sap.m,sap.ui.layout,sap.f,sap.tnt,sap.ui.core,sap.ui.table"
  data-sap-ui-compatVersion="edge"
  data-sap-ui-frameOptions="allow"
  data-sap-ui-async="true">
</script>
<style>
  .kpi-card { min-width: 180px; }
  .kpi-clickable { cursor: pointer; }
  .kpi-clickable:hover .sapMPanelHdr { background: #e8f1fb; }
  .kpi-clickable:hover { box-shadow: inset 0 0 0 1px #0070f2; border-radius: 4px; }
  .severity-CRITICAL { color: #bb0000 !important; font-weight: bold; }
  .severity-WARNING  { color: #e9730c !important; font-weight: bold; }
  .severity-ADVISORY { color: #e6a000 !important; }
  .severity-INFO     { color: #0070f2 !important; }
  .status-BALANCED   { color: #188918 !important; font-weight: bold; }
  .status-ADVISORY   { color: #e6a000 !important; }
  .status-OUT_OF_BALANCE { color: #bb0000 !important; font-weight: bold; }
  .pipeline-step-done { color: #188918; }
  .pipeline-step-pending { color: #707070; }
  .section-header { font-size: 1.2rem; font-weight: 600; color: #32363a; margin: 1rem 0 0.5rem 0; }
  .empty-state { text-align: center; padding: 3rem; color: #6a6d70; }
  .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
</style>
<script>
sap.ui.getCore().attachInit(function () {
  "use strict";

  // ─── state ───────────────────────────────────────────────────────────────
  var BASE   = "/api/mass-balance";
  var ADMIN  = "/api/admin";

  var _stepPanels = {}; // action → { panel, btn, press } — populated by makeStepCard
  var _exceptionsRunFilter        = null; // run UUID filter; null = show all
  var _exceptionsSeverityFilter   = null; // severity filter; null = show all
  var _exceptionsRootCauseFilter  = null; // root cause code filter; null = show all
  var _oExcRunFilterBar  = null;  // InfoToolbar shown when a run filter is active
  var _oExcRunFilterText = null;  // Text control inside that bar
  var _oExcSeverityBtn   = null;  // SegmentedButton for severity filter
  var _oExceptionsTable  = null;  // The exceptions sap.m.Table
  var _rcToggleBtns      = {};    // code → sap.m.ToggleButton for root cause chips

  var RC_DEFS = [
    { code:"MC", label:"Measurement / Calibration", color:"#e9730c" },
    { code:"TX", label:"Transaction Error",          color:"#d20a0a" },
    { code:"MD", label:"Master Data Issue",          color:"#0070f2" },
    { code:"TF", label:"Transfer / Routing",         color:"#188918" },
    { code:"PL", label:"Physical Loss / Gain",       color:"#6a1c8a" },
    { code:"SY", label:"System / Interface",         color:"#696969" }
  ];

  function _applyExcFilters() {
    if (!_oExceptionsTable) return;
    var filters = [];
    if (_exceptionsSeverityFilter) {
      filters.push(new sap.ui.model.Filter("severity", sap.ui.model.FilterOperator.EQ, _exceptionsSeverityFilter));
    }
    if (_exceptionsRootCauseFilter) {
      filters.push(new sap.ui.model.Filter("rootCauseCategory", sap.ui.model.FilterOperator.EQ, _exceptionsRootCauseFilter));
    }
    _oExceptionsTable.getBinding("items").filter(filters);
    if (_oExcSeverityBtn) {
      _oExcSeverityBtn.setSelectedKey(_exceptionsSeverityFilter || "ALL");
    }
    // sync toggle button pressed states
    Object.keys(_rcToggleBtns).forEach(function(code) {
      _rcToggleBtns[code].setPressed(_exceptionsRootCauseFilter === code);
    });
  }

  var oModel = new sap.ui.model.json.JSONModel({
    runs: [], exceptions: [], approvals: [], plants: [], materials: [], tolerances: [],
    kpi: { totalRuns: 0, criticalExceptions: 0, pendingApprovals: 0, balanceStatus: "—" },
    selectedRunId: null,
    busy: false,
    s4WebGuiUrl: '',
    s4Client: '650'
  });

  // Fetch app config (S4 Web GUI URL, client) from backend once on init.
  fetch('/config').then(function(r){ return r.json(); }).then(function(cfg){
    oModel.setProperty('/s4WebGuiUrl', cfg.s4WebGuiUrl || '');
    oModel.setProperty('/s4Client',    cfg.s4Client    || '650');
  }).catch(function(){});

  function s4MaterialUrl(materialCode) {
    var base   = oModel.getProperty('/s4WebGuiUrl');
    var client = oModel.getProperty('/s4Client');
    if (!base || !materialCode) return null;
    return base + '/sap/bc/gui/sap/its/webgui?~transaction=MM03' +
           '&RMMG1-MATNR=' + encodeURIComponent(materialCode) +
           '&sap-client='  + encodeURIComponent(client);
  }

  function s4PlantUrl(plantCode) {
    var base   = oModel.getProperty('/s4WebGuiUrl');
    var client = oModel.getProperty('/s4Client');
    if (!base || !plantCode) return null;
    return base + '/sap/bc/gui/sap/its/webgui?~transaction=OX10' +
           '&sap-client=' + encodeURIComponent(client);
  }

  function s4DocUrl(docNumber, docYear) {
    var base   = oModel.getProperty('/s4WebGuiUrl');
    var client = oModel.getProperty('/s4Client') || '650';
    if (!base || !docNumber) return null;
    var year = docYear || new Date().getFullYear();
    // MB03: Display Material Document — CALL TRANSACTION * skips the initial screen
    // and navigates directly to the document. RM07M-MBLNR / RM07M-MJAHR are the
    // selection-screen field names; fields separated by ; per ITS WebGUI convention.
    var txParam = '*MB03 RM07M-MBLNR=' + docNumber + ';RM07M-MJAHR=' + year;
    return base + '/sap/bc/gui/sap/its/webgui?~transaction=' + encodeURIComponent(txParam) +
           '&sap-client=' + encodeURIComponent(client);
  }

  function openDocInS4(docNumber, docYear) {
    var url = s4DocUrl(docNumber, docYear);
    if (!url) return;
    window.open(url, '_blank');
  }

  // ─── helpers ─────────────────────────────────────────────────────────────
  function odata(path) {
    return fetch(path, {
      headers: { Accept: "application/json" },
      cache: "no-store"
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) throw new Error(d.error.message);
        return Array.isArray(d.value) ? d.value : Array.isArray(d) ? d : [];
      });
  }

  function odataPost(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); });
  }

  function loadAll() {
    oModel.setProperty("/busy", true);
    var excUrl = BASE + "/Exceptions?$orderby=createdAt desc&$top=100&$select=ID,exceptionId,severity,rootCauseCategory,varianceMT,variancePct,varianceSign,status,period,run_ID,plant_ID,tank_ID,material_ID";
    if (_exceptionsRunFilter) excUrl += "&$filter=run_ID eq " + _exceptionsRunFilter;
    Promise.all([
      odata(BASE + "/MassBalanceRuns?$orderby=createdAt desc&$top=50"),
      odata(excUrl),
      odata(BASE + "/ApprovalRequests?$orderby=requestedAt desc&$top=100"),
      odata(ADMIN + "/Plants"),
      odata(ADMIN + "/Materials"),
      odata(ADMIN + "/ToleranceConfigs")
    ]).then(function(results) {
      var runs  = results[0];
      var excs  = results[1];
      var apprs = results[2];
      var lastRun = runs.length ? runs[0] : null;

      // setProperty per-path so bindings always re-evaluate
      oModel.setProperty("/runs",       runs);
      oModel.setProperty("/exceptions", excs);
      oModel.setProperty("/approvals",  apprs);
      oModel.setProperty("/plants",     results[3]);
      oModel.setProperty("/materials",  results[4]);
      oModel.setProperty("/tolerances", results[5]);
      oModel.setProperty("/kpi/totalRuns",         runs.length);
      oModel.setProperty("/kpi/criticalExceptions", excs.filter(function(e){ return e.severity === "CRITICAL"; }).length);
      oModel.setProperty("/kpi/pendingApprovals",   apprs.filter(function(a){ return a.approvalStatus === "PENDING"; }).length);
      oModel.setProperty("/kpi/balanceStatus",      lastRun ? lastRun.balanceStatus || "—" : "—");

      // update exceptions-tab run filter banner
      if (_oExcRunFilterBar) {
        _oExcRunFilterBar.setVisible(!!_exceptionsRunFilter);
        if (_exceptionsRunFilter) {
          var filteredRun = runs.find(function(r){ return r.ID === _exceptionsRunFilter; });
          _oExcRunFilterText.setText("Showing exceptions for: " + (filteredRun ? filteredRun.runId : _exceptionsRunFilter));
        }
      }
      _applyExcFilters();

      // Imperatively populate the Pipeline run selector — non-FAILED runs first
      if (oPipelineRunSel) {
        var prevKey = oPipelineRunSel.getSelectedKey();
        oPipelineRunSel.destroyItems();
        var failedStatuses = ["FAILED","CALCULATING","VALIDATING","INITIATED"];
        var sortedRuns = runs.slice().sort(function(a, b) {
          var aFailed = failedStatuses.indexOf(a.runStatus) !== -1 ? 1 : 0;
          var bFailed = failedStatuses.indexOf(b.runStatus) !== -1 ? 1 : 0;
          return aFailed - bFailed;
        });
        sortedRuns.forEach(function(r) {
          var isFailed = failedStatuses.indexOf(r.runStatus) !== -1;
          oPipelineRunSel.addItem(new sap.ui.core.ListItem({
            key:  r.ID,
            text: (isFailed ? "⚠ " : "✓ ") +
                  (r.runId || r.ID.slice(0,8)) + " | " + (r.period || "?") + " | " + (r.runStatus || "?")
          }));
        });
        if (prevKey) oPipelineRunSel.setSelectedKey(prevKey);
        else if (sortedRuns.length) oPipelineRunSel.setSelectedKey(sortedRuns[0].ID);
      }

      oModel.setProperty("/busy", false);
    }).catch(function(e){
      oModel.setProperty("/busy", false);
      sap.m.MessageToast.show("Error loading data: " + e.message);
    });
  }

  // ─── severity badge ───────────────────────────────────────────────────────
  function severityState(sev) {
    return { CRITICAL:"Error", WARNING:"Warning", ADVISORY:"Warning", INFO:"Information" }[sev] || "None";
  }

  function statusState(s) {
    return { BALANCED:"Success", ADVISORY:"Warning", OUT_OF_BALANCE:"Error",
             COMPLETED:"Success", FAILED:"Error", IN_PROGRESS:"Warning" }[s] || "None";
  }

  // ─── TRIGGER DIALOG ──────────────────────────────────────────────────────
  var oPlantSel = new sap.m.Select({ width: "100%", forceSelection: false });
  var oPipelineRunSel = null; // set by buildAboutPage(), updated by loadAll()

  var oPeriodType = new sap.m.Select({
    width: "100%",
    items: [
      new sap.ui.core.ListItem({ key:"DAILY",   text:"Daily" }),
      new sap.ui.core.ListItem({ key:"MONTHLY", text:"Monthly" })
    ],
    change: function() {
      var isMonthly = oPeriodType.getSelectedKey() === "MONTHLY";
      var cur = oPeriod.getValue() || "";
      if (isMonthly) {
        oPeriod.setDisplayFormat("yyyy-MM");
        oPeriod.setValueFormat("yyyy-MM");
        if (cur.length > 7) oPeriod.setValue(cur.slice(0, 7));
        oPeriodHint.setText("Format: YYYY-MM (e.g. 2026-09)");
      } else {
        oPeriod.setDisplayFormat("yyyy-MM-dd");
        oPeriod.setValueFormat("yyyy-MM-dd");
        if (cur.length === 7) oPeriod.setValue(cur + "-01");
        oPeriodHint.setText("Format: YYYY-MM-DD (e.g. 2026-09-01)");
      }
    }
  });

  var oPeriodHint = new sap.m.Text({ text: "Format: YYYY-MM-DD (e.g. 2026-09-01)" });

  var oPeriod = new sap.m.DatePicker({
    width: "100%", displayFormat: "yyyy-MM-dd", valueFormat: "yyyy-MM-dd",
    value: new Date().toISOString().slice(0,10),
    tooltip: "Daily: YYYY-MM-DD (e.g. 2026-09-01) | Monthly: YYYY-MM (e.g. 2026-09)"
  });

  var oTriggerDialog = new sap.m.Dialog({
    title: "Trigger New Mass Balance Run",
    icon: "sap-icon://play",
    content: [
      new sap.ui.layout.form.SimpleForm({
        layout: sap.ui.layout.form.SimpleFormLayout.ResponsiveGridLayout,
        content: [
          new sap.m.Label({ text: "Plant", required: true }),
          oPlantSel,
          new sap.m.Label({ text: "Period Type", required: true }),
          oPeriodType,
          new sap.m.Label({ text: "Period", required: true }),
          oPeriod
        ]
      })
    ],
    beginButton: new sap.m.Button({
      text: "Trigger Run",
      type: sap.m.ButtonType.Emphasized,
      press: function() {
        var plantId = oPlantSel.getSelectedKey();
        var ptype   = oPeriodType.getSelectedKey();
        var rawPeriod = oPeriod.getValue();
        // Monthly runs need YYYY-MM format; the DatePicker always returns YYYY-MM-DD
        var period  = (ptype === 'MONTHLY' && rawPeriod.length > 7) ? rawPeriod.slice(0, 7) : rawPeriod;
        if (!plantId || !period) {
          sap.m.MessageToast.show("Please select a Plant and Period."); return;
        }
        oTriggerDialog.setBusy(true);
        odataPost(BASE + "/triggerRun", {
          plantId: plantId, periodType: ptype, period: period, triggerType: "ON_DEMAND"
        }).then(function(result){
          oTriggerDialog.setBusy(false);
          oTriggerDialog.close();
          if (result && result.error) {
            sap.m.MessageToast.show("Trigger failed: " + result.error.message);
            return;
          }
          showResultDialog(
            "Run Triggered — AI Agent Ready",
            "Run created successfully!\n\nRun ID: " + (result.runId || result.ID || "?") +
            "\nStatus: " + (result.status || result.runStatus || "INITIATED") +
            "\n\nGo to the Pipeline tab to execute the 10 agentic steps."
          );
          loadAll();
        }).catch(function(e){
          oTriggerDialog.setBusy(false);
          sap.m.MessageToast.show("Failed to trigger run: " + e.message);
        });
      }
    }),
    endButton: new sap.m.Button({
      text: "Cancel",
      press: function(){ oTriggerDialog.close(); }
    })
  });

  // Fetch plants fresh, populate select, THEN open — avoids async timing issues
  function openTriggerDialog() {
    oTriggerDialog.setBusy(true);
    oTriggerDialog.open();
    fetch(ADMIN + "/Plants", { headers: { Accept: "application/json" } })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        oPlantSel.destroyItems();
        (d.value || []).forEach(function(p) {
          oPlantSel.addItem(new sap.ui.core.ListItem({
            key:  p.ID,
            text: p.plantName && p.plantName !== p.plantCode ? p.plantCode + " – " + p.plantName : p.plantCode
          }));
        });
        oTriggerDialog.setBusy(false);
      })
      .catch(function(e) {
        oTriggerDialog.setBusy(false);
        sap.m.MessageToast.show("Could not load plants: " + e.message);
      });
  }

  // ─── PIPELINE ACTIONS ─────────────────────────────────────────────────────
  function formatAgentResult(label, r) {
    if (!r) return label + " completed (no result returned).";
    var lines = ["AI Agent Result — " + label, "─────────────────────────────"];

    // Guard: exception report with 0 exceptions means step 06 was skipped or run FAILED
    if (label === "Exception Report" && r.totalExceptions === 0) {
      lines.push("⚠  No exceptions found for this run.");
      lines.push("   Possible causes:");
      lines.push("   • Step 06 (Investigate & Classify) was not run yet");
      lines.push("   • This run is in FAILED status — choose a completed run");
      lines.push("   Select the correct active run from the dropdown and run");
      lines.push("   Step 06 first, then re-run Exception Report.");
      lines.push("─────────────────────────────");
    }
    var keyLabels = {
      checksPassed:"Checks Passed", checksFailed:"Checks Failed", blockerCount:"Blockers",
      linesProcessed:"Lines Processed", totalVarianceMT:"Total Variance (MT)", balanceStatus:"Balance Status",
      plantLines:"Plant Lines", tankLines:"Tank Lines", materialLines:"Material Lines", exceptionsFound:"Exceptions Found", variancesFound:"Variances Detected",
      infoCount:"INFO Count", advisoryCount:"ADVISORY Count", warningCount:"WARNING Count", criticalCount:"CRITICAL Count",
      overallStatus:"Overall Status", exceptionsInvestigated:"Investigated", classified:"Classified",
      pendingClassification:"Pending Classification", reportId:"Report ID", totalExceptions:"Total Exceptions",
      approvalsPending:"Pending Approvals", dataCompleteness:"Data Completeness", tanksReconciled:"Tanks Reconciled",
      refineryVariancePct:"Refinery Variance %", activeExceptions:"Active Exceptions",
      correctionsPosted:"Corrections Posted", stepsCompleted:"Steps Completed", finalStatus:"Final Status",
      requiresHumanAction:"Requires Human Action", message:"Message"
    };
    Object.keys(keyLabels).forEach(function(k) {
      if (r[k] !== undefined && r[k] !== null) {
        var v = r[k];
        if (k === "dataCompleteness" || k === "refineryVariancePct") v = (parseFloat(v) * 100).toFixed(2) + "%";
        if (k === "totalVarianceMT") v = parseFloat(v).toFixed(3) + " MT";
        lines.push(keyLabels[k] + ": " + v);
      }
    });
    if (r.issues && r.issues.length) {
      lines.push("─────────────────────────────");
      lines.push("Issues (" + r.issues.length + "):");
      r.issues.slice(0, 5).forEach(function(i) {
        lines.push("  [" + (i.severity||"?") + "] " + (i.checkName||"") + " — " + (i.issueDesc||""));
      });
      if (r.issues.length > 5) lines.push("  ... and " + (r.issues.length - 5) + " more");
    }
    if (r.rootCauseSummary && r.rootCauseSummary.length) {
      lines.push("─────────────────────────────");
      lines.push("Root Cause Summary:");
      r.rootCauseSummary.forEach(function(rc) { lines.push("  " + rc.category + ": " + rc.count); });
    }
    return lines.join("\n");
  }

  function showResultDialog(title, text, navLabel, navFn) {
    var oDialog = new sap.m.Dialog({
      title: title,
      contentWidth: "500px",
      content: [ new sap.m.Text({ text: text, wrapping: true }).addStyleClass("sapUiSmallMargin") ]
    });
    if (navLabel && navFn) {
      oDialog.setBeginButton(new sap.m.Button({
        text: navLabel,
        type: sap.m.ButtonType.Emphasized,
        press: function() { oDialog.close(); oDialog.destroy(); navFn(); }
      }));
    }
    oDialog.setEndButton(new sap.m.Button({
      text: "Close",
      press: function() { oDialog.close(); oDialog.destroy(); }
    }));
    oDialog.open();
  }

  var _stepNavMap = {
    "validateData":             { label: "View Run Detail →",              key: "detail"     },
    "calculateBalance":         { label: "View Run Detail →",              key: "detail"     },
    "reconcileAndCompare":      { label: "Next: Check Tolerances (Step 05) →", key: "pipeline"  },
    "checkTolerances":          { label: "Next: Investigate (Step 06) →",  key: "pipeline"   },
    "investigateAndClassify":   { label: "View Exceptions →",              key: "exceptions" },
    "generateExceptionReport":  { label: "View Exceptions →",              key: "exceptions" },
    "generateExecutiveSummary": { label: "View Run Summary →",              key: "detail"     }
  };

  function runAction(path, runId, label) {
    if (!window.confirm("Run \"" + label + "\" for run:\n" + runId + "\n\nAI agents will execute this step.")) return;
    oModel.setProperty("/busy", true);
    var stepRef = _stepPanels[path];
    if (stepRef) stepRef.panel.setBusy(true);
    odataPost(BASE + "/" + path, { runId: runId })
      .then(function(r){
        oModel.setProperty("/busy", false);
        if (stepRef) {
          stepRef.panel.setBusy(false);
          var nav = _stepNavMap[path];
          if (nav && !(r && r.error)) {
            stepRef.btn.detachPress(stepRef.press);
            stepRef.btn.setText(nav.label);
            stepRef.btn.setType(sap.m.ButtonType.Accept);
            stepRef.btn.setIcon("sap-icon://navigation-right-arrow");
            if (nav.key === "detail") {
              stepRef.btn.attachPress(function() { openRunDetail(runId); });
            } else {
              stepRef.btn.attachPress(function() { oIconTabBar.setSelectedKey(nav.key); loadAll(); });
            }
          }
        }
        if (r && r.error) {
          sap.m.MessageToast.show(label + " failed: " + r.error.message);
        } else {
          var nav2 = _stepNavMap[path];
          // When navigating to the exceptions tab, scope it to this run
          if (nav2 && nav2.key === "exceptions") {
            _exceptionsRunFilter = runId;
          }
          var navCb = nav2 ? (nav2.key === "detail"
            ? function() { openRunDetail(runId); }
            : function() { oIconTabBar.setSelectedKey(nav2.key); loadAll(); })
            : null;
          showResultDialog(
            "Step Complete — " + label,
            formatAgentResult(label, r),
            nav2 ? nav2.label : null,
            navCb
          );
          loadAll();
        }
      }).catch(function(e){
        oModel.setProperty("/busy", false);
        if (stepRef) stepRef.panel.setBusy(false);
        sap.m.MessageToast.show(label + " failed: " + e.message);
      });
  }

  // ─── KPI TILES ───────────────────────────────────────────────────────────
  function buildKpiSection() {
    function kpiPanel(title, subtitle, icon, iconColor, valuePath, stateBinding, tabKey) {
      var oPanel = new sap.m.Panel({
        expandable: false,
        content: [
          new sap.m.HBox({
            alignItems: sap.m.FlexAlignItems.Center,
            items: [
              new sap.ui.core.Icon({ src: icon, size: "1.5rem", color: iconColor }).addStyleClass("sapUiSmallMarginEnd"),
              new sap.m.VBox({ items: [
                new sap.m.Title({ text: title, level: sap.ui.core.TitleLevel.H5 }),
                new sap.m.Text({ text: subtitle }).addStyleClass("sapUiTinyMarginTop")
              ]})
            ]
          }).addStyleClass("sapUiSmallMarginBottom"),
          new sap.m.ObjectStatus(stateBinding).addStyleClass("sapMTitle"),
          new sap.m.Text({ text: "tap to view →" }).addStyleClass("sapUiTinyMarginTop")
        ]
      });
      oPanel.addStyleClass("kpi-clickable");
      oPanel.attachBrowserEvent("click", function() {
        if (tabKey === "exceptions") {
          _exceptionsRunFilter = null;
          _exceptionsSeverityFilter = (title === "Critical Exceptions") ? "CRITICAL" : null;
          loadAll();
        }
        oIconTabBar.setSelectedKey(tabKey);
      });
      return new sap.m.VBox({ width: "200px", items: [oPanel] })
        .addStyleClass("sapUiSmallMarginEnd sapUiSmallMarginBottom");
    }

    return new sap.m.FlexBox({
      wrap: sap.m.FlexWrap.Wrap,
      justifyContent: sap.m.FlexJustifyContent.Start,
      items: [
        kpiPanel("Total Runs", "All periods", "sap-icon://history", "#0070f2",
          null,
          { text: "{/kpi/totalRuns}", state: "Information" },
          "runs"),
        kpiPanel("Critical Exceptions", "Require action", "sap-icon://alert", "#bb0000",
          null,
          { text: "{/kpi/criticalExceptions}", state: "{= ${/kpi/criticalExceptions} > 0 ? 'Error' : 'Success' }" },
          "exceptions"),
        kpiPanel("Pending Approvals", "Awaiting review", "sap-icon://pending", "#e9730c",
          null,
          { text: "{/kpi/pendingApprovals}", state: "{= ${/kpi/pendingApprovals} > 0 ? 'Warning' : 'Success' }" },
          "approvals"),
        kpiPanel("Last Balance", "Most recent run", "sap-icon://status-in-process", "#188918",
          null,
          { text: "{/kpi/balanceStatus}", state: { path: "/kpi/balanceStatus", formatter: function(s){ return statusState(s); } } },
          "runs")
      ]
    }).addStyleClass("sapUiSmallMarginTop sapUiSmallMarginBottom");
  }

  // ─── RUN DETAIL DIALOG ──────────────────────────────────────────────────────
  var _oRunDetailDialog = null;

  function openRunDetail(runUUID, runIdStr) {
    if (!runUUID) { sap.m.MessageToast.show("No run selected."); return; }
    if (!_oRunDetailDialog) {
      _oRunDetailDialog = new sap.m.Dialog({
        contentWidth: "85%",
        contentHeight: "80%",
        resizable: true,
        draggable: true,
        stretch: sap.ui.Device.system.phone,
        buttons: [
          new sap.m.Button({ text: "Close", press: function() { _oRunDetailDialog.close(); } })
        ]
      });
    }
    _oRunDetailDialog.setTitle("Run: " + (runIdStr || runUUID));
    _oRunDetailDialog.removeAllContent();
    _oRunDetailDialog.addContent(new sap.m.VBox({
      alignItems: sap.m.FlexAlignItems.Center,
      justifyContent: sap.m.FlexJustifyContent.Center,
      height: "200px",
      items: [ new sap.m.BusyIndicator({ size: "2rem" }) ]
    }));
    _oRunDetailDialog.open();

    var enc = encodeURIComponent(runUUID);
    Promise.all([
      fetch(BASE + "/MassBalanceLines?$filter=run_ID%20eq%20" + enc +
            "&$expand=tank($select=tankId,tankName),material($select=materialCode)&$orderby=severity%20desc")
        .then(function(r){ return r.json(); }),
      fetch(BASE + "/Exceptions?$filter=run_ID%20eq%20" + enc +
            "&$select=ID,exceptionId,severity,rootCauseCategory,varianceMT,variancePct,status")
        .then(function(r){ return r.json(); }),
      fetch(BASE + "/AuditLogs?$filter=run_ID%20eq%20" + enc + "&$orderby=timestamp%20asc")
        .then(function(r){ return r.json(); }),
      fetch(BASE + "/MassBalanceRuns(" + enc + ")" +
            "?$select=balanceStatus,dataCompleteness,tanksReconciled,refineryVariancePct," +
            "correctionsPosted,pendingApprovals,summaryNarrative,period,periodType,runStatus")
        .then(function(r){ return r.json(); })
    ]).then(function(res) {
      var lines = res[0].value || [];
      var excs  = res[1].value || [];
      var logs  = res[2].value || [];
      var run   = res[3] && !res[3].error ? res[3] : {};

      // KPI summary
      var totalVar  = lines.reduce(function(s,l){ return s + (parseFloat(l.variance)||0); }, 0);
      var totalBook = lines.reduce(function(s,l){ return s + (parseFloat(l.closingBook)||0); }, 0);
      var varPctNum = totalBook !== 0 ? (totalVar / totalBook * 100) : 0;
      var varPctStr = totalBook !== 0 ? varPctNum.toFixed(4) + " %" : "—";
      var nCrit = excs.filter(function(e){ return e.severity === "CRITICAL"; }).length;
      var nWarn = excs.filter(function(e){ return e.severity === "WARNING"; }).length;

      function chip(lbl, val, icon, color) {
        return new sap.m.Panel({ content: [
          new sap.m.VBox({
            alignItems: sap.m.FlexAlignItems.Center,
            items: [
              new sap.ui.core.Icon({ src: icon, color: color, size: "1.5rem" }).addStyleClass("sapUiTinyMarginBottom"),
              new sap.m.Title({ text: String(val), level: sap.ui.core.TitleLevel.H2 }),
              new sap.m.Text({ text: lbl })
            ]
          }).addStyleClass("sapUiSmallMarginBeginEnd sapUiSmallMarginTopBottom")
        ]}).addStyleClass("sapUiSmallMarginEnd kpi-card");
      }
      var oKpiRow = new sap.m.FlexBox({ wrap: sap.m.FlexWrap.Wrap, items: [
        chip("Balance Lines",     lines.length, "sap-icon://detail-view", "#0070f2"),
        chip("Refinery Variance", varPctStr,    "sap-icon://measure",     Math.abs(varPctNum) > 0.1 ? "#bb0000" : "#188918"),
        chip("Critical",          nCrit,        "sap-icon://alert",       nCrit > 0 ? "#bb0000" : "#188918"),
        chip("Warning",           nWarn,        "sap-icon://warning2",    nWarn > 0 ? "#e9730c" : "#188918")
      ]}).addStyleClass("sapUiSmallMarginBottom");

      // Balance lines table
      var oLinesTable = new sap.m.Table({
        growing: true, growingThreshold: 10,
        noDataText: "No balance lines calculated yet — run Steps 03–06 first.",
        columns: [
          new sap.m.Column({ header: new sap.m.Label({ text: "Tank" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Material" }), minScreenWidth: sap.m.ScreenSize.Tablet, demandPopin: true }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Opening (MT)" }), hAlign: sap.ui.core.TextAlign.End }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Receipts" }),     hAlign: sap.ui.core.TextAlign.End, minScreenWidth: sap.m.ScreenSize.Tablet, demandPopin: true }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Issues" }),       hAlign: sap.ui.core.TextAlign.End, minScreenWidth: sap.m.ScreenSize.Tablet, demandPopin: true }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Closing Book" }), hAlign: sap.ui.core.TextAlign.End }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Closing Phys." }),hAlign: sap.ui.core.TextAlign.End }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Variance MT" }),  hAlign: sap.ui.core.TextAlign.End }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Severity" }) })
        ]
      });
      lines.forEach(function(l) {
        var fmt = function(v){ return v !== null && v !== undefined ? parseFloat(v).toFixed(3) : "0.000"; };
        var tankName = (l.tank && (l.tank.tankName || l.tank.tankId)) || "—";
        var matCode  = (l.material && l.material.materialCode) || "—";
        var varNum   = parseFloat(l.variance) || 0;
        oLinesTable.addItem(new sap.m.ColumnListItem({
          highlight: severityState(l.severity),
          cells: [
            new sap.m.Text({ text: tankName }),
            new sap.m.Text({ text: matCode }),
            new sap.m.Text({ text: fmt(l.openingStock),    textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.Text({ text: fmt(l.receipts),        textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.Text({ text: fmt(l.issues),          textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.Text({ text: fmt(l.closingBook),     textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.Text({ text: fmt(l.closingPhysical), textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.ObjectStatus({
              text: fmt(varNum) + " MT",
              state: Math.abs(varNum) > 0.001 ? (varNum < 0 ? "Error" : "Warning") : "Success"
            }),
            new sap.m.ObjectStatus({ text: l.severity || "INFO", state: severityState(l.severity) })
          ]
        }));
      });

      // Exceptions table
      var oExcTable = new sap.m.Table({
        noDataText: "No exceptions for this run.",
        columns: [
          new sap.m.Column({ header: new sap.m.Label({ text: "Exception ID" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Severity" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Root Cause" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Variance MT" }), hAlign: sap.ui.core.TextAlign.End }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Status" }) })
        ]
      });
      excs.forEach(function(e) {
        oExcTable.addItem(new sap.m.ColumnListItem({
          cells: [
            new sap.m.Text({ text: e.exceptionId || "—" }),
            new sap.m.ObjectStatus({ text: e.severity, state: severityState(e.severity) }),
            new sap.m.Text({ text: e.rootCauseCategory || "—" }),
            new sap.m.Text({ text: e.varianceMT ? parseFloat(e.varianceMT).toFixed(3) + " MT" : "—", textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.ObjectStatus({ text: e.status, state: statusState(e.status) })
          ]
        }));
      });

      // Audit log
      var oAuditList = new sap.m.List({ noDataText: "No audit entries." });
      logs.forEach(function(a) {
        oAuditList.addItem(new sap.m.StandardListItem({
          title: (a.agentStep || "") + ": " + (a.action || "").substring(0, 80),
          description: a.timestamp ? new Date(a.timestamp).toLocaleString() : "",
          icon: a.result === "SUCCESS" ? "sap-icon://accept" : a.result === "WARNING" ? "sap-icon://alert" : "sap-icon://error",
          iconInset: false
        }));
      });

      _oRunDetailDialog.removeAllContent();

      // Executive Summary panel (only when Step 10 has run)
      var oSummaryPanel = null;
      if (run.balanceStatus && run.balanceStatus !== 'PENDING') {
        var bsState = run.balanceStatus === 'WITHIN_TOLERANCE' ? 'Success' : 'Error';
        var bsIcon  = run.balanceStatus === 'WITHIN_TOLERANCE' ? 'sap-icon://sys-enter-2' : 'sap-icon://alert';
        var kpiItems = [
          { l: "Balance Status",    v: run.balanceStatus ? run.balanceStatus.replace(/_/g,' ') : "—", icon: bsIcon,                   color: run.balanceStatus === 'WITHIN_TOLERANCE' ? '#188918' : '#bb0000' },
          { l: "Refinery Variance", v: run.refineryVariancePct != null ? parseFloat(run.refineryVariancePct).toFixed(4)+'%' : "—",   icon: 'sap-icon://measure',      color: Math.abs(parseFloat(run.refineryVariancePct)||0)>0.1?'#bb0000':'#188918' },
          { l: "Data Completeness", v: run.dataCompleteness  != null ? parseFloat(run.dataCompleteness).toFixed(2)+'%'  : "—",       icon: 'sap-icon://detail-view',  color: '#0070f2' },
          { l: "Tanks Reconciled",  v: run.tanksReconciled   != null ? String(run.tanksReconciled) : "0",                            icon: 'sap-icon://tank-gauge',   color: '#0070f2' },
          { l: "Active Exceptions", v: String(excs.length),                                                                          icon: 'sap-icon://warning2',     color: excs.length > 0 ? '#e9730c' : '#188918' },
          { l: "Pending Approvals", v: run.pendingApprovals  != null ? String(run.pendingApprovals) : "0",                          icon: 'sap-icon://task',         color: (run.pendingApprovals||0) > 0 ? '#bb0000' : '#188918' }
        ];
        var oSummaryKpis = new sap.m.FlexBox({ wrap: sap.m.FlexWrap.Wrap, items: kpiItems.map(function(k){
          return new sap.m.Panel({ content: [
            new sap.m.VBox({
              alignItems: sap.m.FlexAlignItems.Center,
              items: [
                new sap.ui.core.Icon({ src: k.icon, color: k.color, size: '1.4rem' }).addStyleClass('sapUiTinyMarginBottom'),
                new sap.m.Title({ text: k.v, level: sap.ui.core.TitleLevel.H3 }),
                new sap.m.Text({ text: k.l })
              ]
            }).addStyleClass('sapUiSmallMarginBeginEnd sapUiTinyMarginTopBottom')
          ]}).addStyleClass('sapUiSmallMarginEnd kpi-card');
        })}).addStyleClass('sapUiSmallMarginBottom');

        var oNarrativeItems = [ oSummaryKpis ];
        if (run.summaryNarrative) {
          oNarrativeItems.push(
            new sap.m.Panel({
              content: [
                new sap.m.Text({ text: run.summaryNarrative, wrapping: true })
                  .addStyleClass('sapUiSmallMargin')
              ]
            }).addStyleClass('sapUiSmallMarginBottom')
          );
        }
        oSummaryPanel = new sap.m.Panel({
          headerText: 'Executive Summary',
          expandable: true, expanded: true,
          content: [ new sap.m.VBox({ items: oNarrativeItems }) ]
        }).addStyleClass('sapUiSmallMarginBottom');
      }

      var oDialogItems = [];
      if (oSummaryPanel) oDialogItems.push(oSummaryPanel);
      oDialogItems = oDialogItems.concat([
        oKpiRow,
        new sap.m.Title({ text: "Balance Lines", level: sap.ui.core.TitleLevel.H3 }).addStyleClass("sapUiSmallMarginBottom"),
        oLinesTable,
        new sap.m.Title({ text: "Exceptions", level: sap.ui.core.TitleLevel.H3 }).addStyleClass("sapUiSmallMarginTopBottom"),
        oExcTable,
        new sap.m.Panel({
          headerText: "Audit Log",
          expandable: true, expanded: false,
          content: [ oAuditList ]
        }).addStyleClass("sapUiSmallMarginTop")
      ]);

      _oRunDetailDialog.addContent(new sap.m.ScrollContainer({
        vertical: true, horizontal: false, height: "100%",
        content: [ new sap.m.VBox({ items: oDialogItems }) ]
      }));
    }).catch(function(err) {
      _oRunDetailDialog.removeAllContent();
      _oRunDetailDialog.addContent(new sap.m.Text({ text: "Failed to load run details: " + err.message }));
    });
  }

  // ─── RUNS TABLE ──────────────────────────────────────────────────────────
  function buildRunsPage() {
    var oTable = new sap.m.Table({
      growing: true,
      growingThreshold: 20,
      noDataText: "No runs yet. Trigger the first run above.",
      columns: [
        new sap.m.Column({ header: new sap.m.Label({ text: "Run ID" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Period" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Type" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Status" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Balance" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Variance %" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Completeness" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Actions" }) })
      ],
      items: {
        path: "/runs",
        template: new sap.m.ColumnListItem({
          type: sap.m.ListType.Navigation,
          vAlign: sap.ui.core.VerticalAlign.Middle,
          press: function(e) {
            var ctx = e.getSource().getBindingContext();
            if (ctx) openRunDetail(ctx.getProperty("ID"), ctx.getProperty("runId"));
          },
          cells: [
            new sap.m.Text({ text: "{runId}" }),
            new sap.m.Text({ text: "{period}" }),
            new sap.m.ObjectStatus({ text: "{periodType}", state: "Information" }),
            new sap.m.ObjectStatus({
              text: "{runStatus}",
              state: { path: "runStatus", formatter: function(s){ return statusState(s); } }
            }),
            new sap.m.ObjectStatus({
              text: "{balanceStatus}",
              state: { path: "balanceStatus", formatter: function(s){ return statusState(s); } }
            }),
            new sap.m.Text({
              text: {
                path: "refineryVariancePct",
                formatter: function(v){ return v !== null && v !== undefined ? (parseFloat(v)*100).toFixed(3) + " %" : "—"; }
              }
            }),
            new sap.m.ProgressIndicator({
              percentValue: { path: "dataCompleteness", formatter: function(v){ return v ? parseFloat(v)*100 : 0; } },
              displayValue: { path: "dataCompleteness", formatter: function(v){ return v ? (parseFloat(v)*100).toFixed(0)+"%" : "0%"; } },
              state: sap.ui.core.ValueState.Success,
              width: "120px"
            }),
            new sap.m.HBox({
              items: [
                new sap.m.Button({
                  icon: "sap-icon://validate",
                  tooltip: "Validate Data (Step 02)",
                  press: function(e) {
                    var ctx = e.getSource().getBindingContext();
                    var id = ctx ? ctx.getProperty("ID") : null;
                    if (!id) { sap.m.MessageToast.show("Could not get Run ID — try refreshing."); return; }
                    runAction("validateData", id, "Validate Data");
                  }
                }),
                new sap.m.Button({
                  icon: "sap-icon://simulate",
                  tooltip: "Calculate Balance (Step 03)",
                  press: function(e) {
                    var ctx = e.getSource().getBindingContext();
                    var id = ctx ? ctx.getProperty("ID") : null;
                    if (!id) { sap.m.MessageToast.show("Could not get Run ID — try refreshing."); return; }
                    runAction("calculateBalance", id, "Calculate Balance");
                  }
                }).addStyleClass("sapUiTinyMarginBegin"),
                new sap.m.Button({
                  icon: "sap-icon://detail-view",
                  tooltip: "Generate Exception Report (Step 07)",
                  press: function(e) {
                    var ctx = e.getSource().getBindingContext();
                    var id     = ctx ? ctx.getProperty("ID")        : null;
                    var status = ctx ? ctx.getProperty("runStatus")  : null;
                    var runId  = ctx ? ctx.getProperty("runId")      : null;
                    if (!id) { sap.m.MessageToast.show("Could not get Run ID — try refreshing."); return; }
                    var readyStatuses = ["INVESTIGATING","CHECKING_TOL","REPORTING","PENDING_APPR","COMPLETED"];
                    if (readyStatuses.indexOf(status) === -1) {
                      sap.m.MessageBox.warning(
                        "Exception report cannot be generated for this run.\n\n" +
                        "Run: " + (runId || id) + "\n" +
                        "Status: " + (status || "Unknown") + "\n\n" +
                        "The exception report requires that Step 06 — Investigate & Classify " +
                        "has completed successfully first.\n\n" +
                        (status === "FAILED"
                          ? "This run failed during an earlier step. Please trigger a new run, " +
                            "ensure all data is available, and re-run the full pipeline."
                          : "Complete the earlier pipeline steps (up to Step 06) before generating the report."),
                        { title: "Run Not Ready — Cannot Generate Report" }
                      );
                      return;
                    }
                    runAction("generateExceptionReport", id, "Exception Report");
                  }
                }).addStyleClass("sapUiTinyMarginBegin"),
                new sap.m.Button({
                  icon: "sap-icon://alert",
                  text: "Run Step 06",
                  type: sap.m.ButtonType.Critical,
                  tooltip: "Investigate & Classify exceptions (Step 06 — required before generating exception report)",
                  visible: {
                    path: "runStatus",
                    formatter: function(s) {
                      return ["FAILED","INITIATED","VALIDATING","CALCULATING"].indexOf(s) !== -1;
                    }
                  },
                  press: function(e) {
                    var ctx = e.getSource().getBindingContext();
                    var id = ctx ? ctx.getProperty("ID") : null;
                    if (!id) { sap.m.MessageToast.show("Could not get Run ID — try refreshing."); return; }
                    runAction("investigateAndClassify", id, "Investigate & Classify (Step 06)");
                  }
                }).addStyleClass("sapUiTinyMarginBegin"),
                new sap.m.Button({
                  icon: "sap-icon://exception",
                  text: "View Exceptions",
                  tooltip: "View Exceptions for this run",
                  press: function(e) {
                    var ctx = e.getSource().getBindingContext();
                    var id = ctx ? ctx.getProperty("ID") : null;
                    if (!id) { sap.m.MessageToast.show("Could not get Run ID — try refreshing."); return; }
                    _exceptionsRunFilter = id;
                    oIconTabBar.setSelectedKey("exceptions");
                    loadAll();
                  }
                }).addStyleClass("sapUiTinyMarginBegin")
              ]
            })
          ]
        })
      }
    });

    var oTriggerBtn = new sap.m.Button({
      text: "Trigger New Run",
      type: sap.m.ButtonType.Emphasized,
      icon: "sap-icon://play",
      press: function() { openTriggerDialog(); }    });

    return new sap.m.VBox({
      items: [
        new sap.m.Toolbar({
          content: [
            new sap.m.Title({ text: "Mass Balance Runs", level: sap.ui.core.TitleLevel.H2 }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ icon: "sap-icon://refresh", tooltip: "Refresh", press: loadAll }),
            oTriggerBtn
          ]
        }),
        oTable
      ]
    });
  }

  // ─── EXCEPTIONS TABLE ────────────────────────────────────────────────────
  function buildExceptionsPage() {
    _oExceptionsTable = new sap.m.Table({
      growing: true,
      growingThreshold: 30,
      noDataText: "No exceptions detected yet.",
      columns: [
        new sap.m.Column({ header: new sap.m.Label({ text: "Exception ID" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Severity" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Root Cause" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Variance MT" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Variance %" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Status" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Period" }) })
      ],
      items: {
        path: "/exceptions",
        template: new sap.m.ColumnListItem({
          highlight: { path: "severity", formatter: function(s){ return severityState(s); } },
          cells: [
            new sap.m.Text({ text: "{exceptionId}" }),
            new sap.m.ObjectStatus({
              text: "{severity}",
              state: { path: "severity", formatter: function(s){ return severityState(s); } }
            }),
            new sap.m.ObjectStatus({
              text: "{rootCauseCategory}",
              icon: {
                path: "rootCauseCategory",
                formatter: function(c) {
                  return { MC:"sap-icon://measure", TX:"sap-icon://transaction",
                           MD:"sap-icon://database", TF:"sap-icon://transfer",
                           PL:"sap-icon://pipeline-analysis", SY:"sap-icon://system-exit" }[c] || "";
                }
              }
            }),
            new sap.m.Text({
              text: { path: "varianceMT", formatter: function(v){ return v ? parseFloat(v).toFixed(3) + " MT" : "—"; } }
            }),
            new sap.m.Text({
              text: { path: "variancePct", formatter: function(v){ return v ? parseFloat(v).toFixed(4) + " %" : "—"; } }
            }),
            new sap.m.ObjectStatus({
              text: "{status}",
              state: { path: "status", formatter: function(s){ return statusState(s); } }
            }),
            new sap.m.Text({ text: "{period}", wrapping: false })
          ]
        })
      }
    });

    _oExcRunFilterText = new sap.m.Text({ text: "" });
    _oExcRunFilterBar  = new sap.m.Toolbar({
      visible: false,
      style: sap.m.ToolbarStyle.Info,
      content: [
        new sap.ui.core.Icon({ src: "sap-icon://filter", color: "#0070f2" }).addStyleClass("sapUiTinyMarginEnd"),
        _oExcRunFilterText,
        new sap.m.ToolbarSpacer(),
        new sap.m.Button({
          text: "Show All Runs",
          icon: "sap-icon://clear-filter",
          press: function() {
            _exceptionsRunFilter = null;
            loadAll();
          }
        })
      ]
    });

    _oExcSeverityBtn = new sap.m.SegmentedButton({
              selectionChange: function(e) {
                var key = e.getParameter("item").getKey();
                _exceptionsSeverityFilter = (key !== "ALL") ? key : null;
                _applyExcFilters();
              },
              items: [
                new sap.m.SegmentedButtonItem({ key: "ALL",      text: "All" }),
                new sap.m.SegmentedButtonItem({ key: "CRITICAL", text: "Critical" }),
                new sap.m.SegmentedButtonItem({ key: "WARNING",  text: "Warning" }),
                new sap.m.SegmentedButtonItem({ key: "ADVISORY", text: "Advisory" }),
                new sap.m.SegmentedButtonItem({ key: "INFO",     text: "Info" })
              ]
            });

    return new sap.m.VBox({
      items: [
        new sap.m.Toolbar({
          content: [
            new sap.m.Title({ text: "Exceptions", level: sap.ui.core.TitleLevel.H2 }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ icon: "sap-icon://refresh", tooltip: "Refresh", press: loadAll }),
            _oExcSeverityBtn
          ]
        }),
        _oExcRunFilterBar,
        (function() {
          var oRcFlexBox = new sap.m.FlexBox({ wrap: sap.m.FlexWrap.Wrap });
          RC_DEFS.forEach(function(rc) {
            var oBtn = new sap.m.ToggleButton({
              text: rc.code + "  " + rc.label,
              pressed: false,
              press: function(e) {
                var pressed = e.getSource().getPressed();
                _exceptionsRootCauseFilter = pressed ? rc.code : null;
                _applyExcFilters();
              }
            });
            oBtn.addStyleClass("sapUiTinyMarginEnd sapUiTinyMarginBottom");
            _rcToggleBtns[rc.code] = oBtn;
            oRcFlexBox.addItem(oBtn);
          });
          var oClearBtn = new sap.m.Button({
            text: "Clear filter",
            icon: "sap-icon://clear-filter",
            press: function() {
              _exceptionsRootCauseFilter = null;
              _applyExcFilters();
            }
          }).addStyleClass("sapUiTinyMarginEnd");
          return new sap.m.Panel({
            headerText: "Filter by Root Cause",
            expandable: true,
            expanded: false,
            content: [ new sap.m.VBox({ items: [
              new sap.m.Text({ text: "Click a category to filter the exceptions list. Click again to clear." })
                .addStyleClass("sapUiTinyMarginBottom"),
              oRcFlexBox,
              oClearBtn
            ]})]
          }).addStyleClass("sapUiSmallMarginBottom");
        })(),
        _oExceptionsTable
      ]
    });
  }
  function buildApprovalsPage() {
    var oTable = new sap.m.Table({
      growing: true,
      growingThreshold: 30,
      noDataText: "No pending approvals.",
      columns: [
        new sap.m.Column({ header: new sap.m.Label({ text: "Approval ID" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Type" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Priority" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Status" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "SAP Doc #" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Proposed Action" }), minScreenWidth: sap.m.ScreenSize.Tablet, demandPopin: true }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Requested" }), minScreenWidth: sap.m.ScreenSize.Tablet, demandPopin: true }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Actions" }) })
      ],
      items: {
        path: "/approvals",
        template: new sap.m.ColumnListItem({
          highlight: {
            path: "approvalStatus",
            formatter: function(s){ return s === "PENDING" ? "Warning" : s === "APPROVED" ? "Success" : "Error"; }
          },
          cells: [
            new sap.m.Text({ text: "{approvalId}" }),
            new sap.m.Text({ text: "{approvalType}" }),
            new sap.m.ObjectStatus({
              text: "{priority}",
              state: {
                path: "priority",
                formatter: function(p){ return {URGENT:"Error",HIGH:"Warning",MEDIUM:"Information",LOW:"None"}[p] || "None"; }
              }
            }),
            new sap.m.ObjectStatus({
              text: "{approvalStatus}",
              state: {
                path: "approvalStatus",
                formatter: function(s){ return {APPROVED:"Success",REJECTED:"Error",PENDING:"Warning"}[s] || "None"; }
              }
            }),
            new sap.m.Link({
              text: { path: "sapDocNumber", formatter: function(d){ return d || "—"; } },
              enabled: { path: "sapDocNumber", formatter: function(d){ return !!d && !!oModel.getProperty('/s4WebGuiUrl'); } },
              press: function(e) {
                var ctx = e.getSource().getBindingContext();
                openDocInS4(
                  ctx && ctx.getProperty("sapDocNumber"),
                  ctx && ctx.getProperty("sapDocYear")
                );
              }
            }),
            new sap.m.ExpandableText({ text: "{proposedAction}", maxCharacters: 120 }),
            new sap.m.Text({ text: { path: "requestedAt", formatter: function(d){ return d ? new Date(d).toLocaleDateString() : "—"; } } }),
            new sap.m.HBox({
              items: [
                new sap.m.Button({
                  text: "Approve",
                  type: sap.m.ButtonType.Accept,
                  visible: { path: "approvalStatus", formatter: function(s){ return s === "PENDING"; } },
                  customData: [new sap.ui.core.CustomData({ key: "id", value: "{ID}" })],
                  press: function(e) {
                    var id = e.getSource().data("id");
                    if (!id) { sap.m.MessageToast.show("Could not get approval ID"); return; }
                    if (!window.confirm("Approve this request?")) return;
                    odataPost(BASE + "/approve", { approvalId: id, comments: "Approved via UI" })
                      .then(function(r){
                        if (r && r.error) { sap.m.MessageToast.show("Error: " + r.error.message); return; }
                        sap.m.MessageToast.show("Approved! SAP Doc: " + (r.sapDocNumber || "—") + " — " + (r.message || ""));
                        loadAll();
                      }).catch(function(e){ sap.m.MessageToast.show("Error: " + e.message); });
                  }
                }),
                new sap.m.Button({
                  text: "Reject",
                  type: sap.m.ButtonType.Reject,
                  visible: { path: "approvalStatus", formatter: function(s){ return s === "PENDING"; } },
                  customData: [new sap.ui.core.CustomData({ key: "id", value: "{ID}" })],
                  press: function(e) {
                    var id = e.getSource().data("id");
                    if (!id) { sap.m.MessageToast.show("Could not get approval ID"); return; }
                    if (!window.confirm("Reject this request?")) return;
                    odataPost(BASE + "/rejectApproval", { approvalId: id, comments: "Rejected via UI" })
                      .then(function(r){
                        if (r && r.error) { sap.m.MessageToast.show("Error: " + r.error.message); return; }
                        sap.m.MessageToast.show("Rejected. Exception returned to OPEN status.");
                        loadAll();
                      }).catch(function(e){ sap.m.MessageToast.show("Error: " + e.message); });
                  }
                }).addStyleClass("sapUiTinyMarginBegin")
              ]
            })
          ]
        })
      }
    });

    return new sap.m.VBox({
      items: [
        new sap.m.Toolbar({
          content: [
            new sap.m.Title({ text: "Approval Requests", level: sap.ui.core.TitleLevel.H2 }),
            new sap.m.Text({ text: " (Human-in-the-Loop — no auto-corrections)" }).addStyleClass("sapUiSmallMarginBegin"),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ icon: "sap-icon://refresh", tooltip: "Refresh", press: loadAll })
          ]
        }),
        oTable
      ]
    });
  }

  // ─── CONFIG PAGE ─────────────────────────────────────────────────────────
  function buildConfigPage() {
    var oPlants = new sap.m.List({
      headerText: "Refineries / Plants",
      items: { path: "/plants", template: new sap.m.ObjectListItem({
        title: "{plantCode}",
        intro: "{country}",
        type: { path: "/s4WebGuiUrl", formatter: function(u){ return u ? sap.m.ListType.Navigation : sap.m.ListType.Inactive; } },
        press: function(e) {
          var ctx = e.getSource().getBindingContext();
          var url = s4PlantUrl(ctx && ctx.getProperty("plantCode"));
          if (url) window.open(url, "_blank");
        },
        attributes: [
          new sap.m.ObjectAttribute({ title: "Name",   text: "{plantName}" }),
          new sap.m.ObjectAttribute({ title: "Region", text: "{region}" })
        ]
      })}
    });

    var oMaterials = new sap.m.List({
      headerText: "Hydrocarbon Materials",
      items: { path: "/materials", template: new sap.m.ObjectListItem({
        title: "{materialCode}",
        intro: "{productGroup}",
        type: { path: "/s4WebGuiUrl", formatter: function(u){ return u ? sap.m.ListType.Navigation : sap.m.ListType.Inactive; } },
        press: function(e) {
          var ctx = e.getSource().getBindingContext();
          var url = s4MaterialUrl(ctx && ctx.getProperty("materialCode"));
          if (url) window.open(url, "_blank");
        },
        attributes: [
          new sap.m.ObjectAttribute({ title: "Description", text: "{materialDesc}" }),
          new sap.m.ObjectAttribute({ title: "Base UOM",    text: "{baseUom}" }),
          new sap.m.ObjectAttribute({ title: "Density",     text: { path: "density", formatter: function(d){ return d ? parseFloat(d).toFixed(4) + " kg/L" : "—"; } } }),
          new sap.m.ObjectAttribute({ title: "API Gravity", text: { path: "apiGravity", formatter: function(v){ return v ? parseFloat(v).toFixed(1) + " °API" : "—"; } } })
        ]
      })}
    });

    var oTolerance = new sap.m.Table({
      headerText: "Tolerance Configuration",
      columns: [
        new sap.m.Column({ header: new sap.m.Label({ text: "Level" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Material Group" }) }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Daily %" }),    hAlign: sap.ui.core.TextAlign.End }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Monthly %" }),  hAlign: sap.ui.core.TextAlign.End }),
        new sap.m.Column({ header: new sap.m.Label({ text: "Escalation" }), minScreenWidth: sap.m.ScreenSize.Tablet, demandPopin: true })
      ],
      items: {
        path: "/tolerances",
        template: new sap.m.ColumnListItem({
          cells: [
            new sap.m.ObjectStatus({ text: "{level}", state: { path: "level", formatter: function(l){ return l === "REFINERY" ? "Error" : l === "PLANT" ? "Warning" : "None"; } } }),
            new sap.m.Text({ text: "{materialGroup}" }),
            new sap.m.Text({ text: { path: "dailyTolerance",   formatter: function(v){ return v ? (parseFloat(v)*100).toFixed(2) + "%" : "—"; } }, textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.Text({ text: { path: "monthlyTolerance", formatter: function(v){ return v ? (parseFloat(v)*100).toFixed(2) + "%" : "—"; } }, textAlign: sap.ui.core.TextAlign.End }),
            new sap.m.Text({ text: "{escalationAction}" })
          ]
        })
      }
    });

    return new sap.m.VBox({
      items: [
        new sap.m.Toolbar({
          content: [
            new sap.m.Title({ text: "Reference Data & Configuration", level: sap.ui.core.TitleLevel.H2 }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ icon: "sap-icon://refresh", tooltip: "Refresh", press: loadAll })
          ]
        }),
        new sap.m.FlexBox({
          wrap: sap.m.FlexWrap.Wrap,
          alignItems: sap.m.FlexAlignItems.Start,
          items: [
            new sap.m.VBox({ width: "340px", items: [oPlants] }).addStyleClass("sapUiSmallMarginEnd"),
            new sap.m.VBox({ width: "460px", items: [oMaterials] }).addStyleClass("sapUiSmallMarginEnd"),
            new sap.m.VBox({ width: "100%", items: [oTolerance] })
          ]
        }),
        buildSecurityPanel()
      ]
    });
  }

  // ─── SECURITY COMPLIANCE PANEL ──────────────────────────────────────────
  function buildSecurityPanel() {
    var checks = [
      // Critical
      { group: "Authentication & Access",   label: "XSUAA Authentication",             status: "OPEN",   severity: "Error",   detail: "auth:dummy active — XSUAA + approuter not yet configured" },
      { group: "Authentication & Access",   label: "Approuter / Login Gate",            status: "OPEN",   severity: "Error",   detail: "No approuter in manifest.yml — endpoints are world-accessible" },
      { group: "Authentication & Access",   label: "Service-level @requires guard",     status: "OPEN",   severity: "Error",   detail: "MassBalanceService has no @requires annotation" },
      // Medium — FIXED
      { group: "Input Validation",          label: "Period parameter format check",     status: "FIXED",  severity: "Success", detail: "Regex /^\\d{4}-\\d{2}(-\\d{2})?$/ enforced in triggerRun & runFullPipeline" },
      { group: "Input Validation",          label: "periodType allowlist",              status: "FIXED",  severity: "Success", detail: "Only DAILY / MONTHLY accepted; 400 returned for any other value" },
      { group: "Input Validation",          label: "rootCauseCategory allowlist",       status: "FIXED",  severity: "Success", detail: "MC, TX, MD, TF, PL, SY only; validated before DB write" },
      { group: "Input Validation",          label: "priority allowlist",                status: "FIXED",  severity: "Success", detail: "URGENT, HIGH, MEDIUM, LOW only" },
      { group: "Production Dependencies",   label: "@sap/cds-dk in devDependencies",    status: "FIXED",  severity: "Success", detail: "Moved from dependencies — no longer shipped in production bundle" },
      // Low — FIXED
      { group: "Logging & Secrets",         label: "Token error log sanitization",      status: "FIXED",  severity: "Success", detail: "AI Core OAuth error logged as code only — full response body suppressed" },
      { group: "Logging & Secrets",         label: "Free-text payload size limit",      status: "FIXED",  severity: "Success", detail: "narrative, proposedAction, comments capped at 2000 chars" },
      { group: "Logging & Secrets",         label: "No secrets in source code",         status: "OK",     severity: "Success", detail: "All credentials via CF env vars (cf set-env) — none in code or manifest" },
      // Always OK
      { group: "Transport & Infrastructure","label": "HTTPS enforced",                  status: "OK",     severity: "Success", detail: "CF Gorouter terminates TLS — HTTP not reachable externally" },
      { group: "Transport & Infrastructure","label": "CORS — not permissive",           status: "OK",     severity: "Success", detail: "No custom CORS headers — UI served from same origin as API" },
      { group: "Data Access",               label: "SQL injection prevention",          status: "OK",     severity: "Success", detail: "All local DB queries use CAP ORM parameterized fluent API" },
      { group: "Data Access",               label: "S/4 filter encoding",               status: "OK",     severity: "Success", detail: "_fEncode encodes spaces and single-quotes; period validated by regex before use" }
    ];

    var groups = {};
    checks.forEach(function(c) {
      if (!groups[c.group]) groups[c.group] = [];
      groups[c.group].push(c);
    });

    var openCount  = checks.filter(function(c){ return c.status === "OPEN";  }).length;
    var fixedCount = checks.filter(function(c){ return c.status === "FIXED"; }).length;
    var okCount    = checks.filter(function(c){ return c.status === "OK";    }).length;

    // Summary strip
    var oSummary = new sap.m.FlexBox({
      wrap: sap.m.FlexWrap.Wrap,
      items: [
        _secKpi("Open (Action Required)", openCount,  "sap-icon://alert",  openCount  > 0 ? "#bb0000" : "#188918"),
        _secKpi("Fixed This Release",      fixedCount, "sap-icon://accept", "#188918"),
        _secKpi("Compliant",               okCount,    "sap-icon://sys-enter-2", "#0070f2")
      ]
    }).addStyleClass("sapUiSmallMarginBottom");

    // Build one list per group
    var groupPanels = Object.keys(groups).map(function(grp) {
      var oList = new sap.m.List({ showNoData: false });
      groups[grp].forEach(function(c) {
        var icon = c.status === "OPEN"  ? "sap-icon://alert"    :
                   c.status === "FIXED" ? "sap-icon://accept"   : "sap-icon://sys-enter-2";
        var color= c.status === "OPEN"  ? "#bb0000" :
                   c.status === "FIXED" ? "#188918" : "#0070f2";
        oList.addItem(new sap.m.CustomListItem({
          content: [ new sap.m.FlexBox({
            alignItems: sap.m.FlexAlignItems.Center,
            items: [
              new sap.ui.core.Icon({ src: icon, color: color, size: "1rem" })
                .addStyleClass("sapUiSmallMarginEnd"),
              new sap.m.VBox({ items: [
                new sap.m.Text({ text: c.label, wrapping: false }).addStyleClass("sapMTextBold"),
                new sap.m.Text({ text: c.detail, wrapping: true })
                  .addStyleClass("sapUiTinyMarginTop")
              ]}).addStyleClass("sapUiContentPadding"),
              new sap.m.ObjectStatus({
                text : c.status,
                state: c.severity
              }).addStyleClass("sapUiSmallMarginBegin")
            ]
          }).addStyleClass("sapUiSmallMarginBeginEnd sapUiTinyMarginTopBottom") ]
        }));
      });
      return new sap.m.Panel({
        headerText: grp,
        expandable: true,
        expanded: true,
        content: [ oList ]
      }).addStyleClass("sapUiSmallMarginBottom");
    });

    return new sap.m.Panel({
      headerText: "Security Compliance",
      expandable: true,
      expanded: true,
      content: [ new sap.m.VBox({ items: [oSummary].concat(groupPanels) }) ]
    }).addStyleClass("sapUiMediumMarginTop");
  }

  function _secKpi(label, value, icon, color) {
    return new sap.m.Panel({ content: [
      new sap.m.VBox({
        alignItems: sap.m.FlexAlignItems.Center,
        items: [
          new sap.ui.core.Icon({ src: icon, color: color, size: "1.5rem" }).addStyleClass("sapUiTinyMarginBottom"),
          new sap.m.Title({ text: String(value), level: sap.ui.core.TitleLevel.H2 }),
          new sap.m.Text({ text: label })
        ]
      }).addStyleClass("sapUiSmallMarginBeginEnd sapUiSmallMarginTopBottom")
    ]}).addStyleClass("sapUiSmallMarginEnd kpi-card");
  }

  // ─── PIPELINE TAB ────────────────────────────────────────────────────────
  function buildAboutPage() {

    // Run selector — oPipelineRunSel (outer scope) is populated by loadAll()
    var oRunSel = new sap.m.Select({ width: "340px", forceSelection: false });
    oPipelineRunSel = oRunSel;

    function getSelectedRunId() {
      return oPipelineRunSel.getSelectedKey();
    }

    function pipelineAction(action, title) {
      var runId = getSelectedRunId();
      if (!runId) {
        sap.m.MessageToast.show("Select a run from the 'Active Run' dropdown first.");
        return;
      }
      if (action === "triggerRun" || action === "runFullPipeline") {
        openTriggerDialog();
        return;
      }
      runAction(action, runId, title);
    }

    function makeStepCard(num, icon, title, desc, action, btnText, emphasized) {
      var fnPress = (function(a, t) {
        return function() {
          try { pipelineAction(a, t); }
          catch(err) { sap.m.MessageToast.show("Error: " + err.message); }
        };
      }(action, title));

      var oBtn = new sap.m.Button({
        text: btnText,
        icon: icon,
        type: emphasized ? sap.m.ButtonType.Emphasized : sap.m.ButtonType.Default,
        press: fnPress
      });

      var oPanel = new sap.m.Panel({
        expandable: false,
        content: [
          new sap.m.HBox({
            alignItems: sap.m.FlexAlignItems.Start,
            items: [
              new sap.ui.core.Icon({ src: icon, size: "1.8rem", color: emphasized ? "#0070f2" : "#47637d" })
                .addStyleClass("sapUiSmallMarginEnd"),
              new sap.m.VBox({ items: [
                new sap.m.Title({ text: "Step " + num + " — " + title, level: sap.ui.core.TitleLevel.H5 }),
                new sap.m.Text({ text: desc }).addStyleClass("sapUiTinyMarginTop")
              ]})
            ]
          }).addStyleClass("sapUiSmallMarginBottom"),
          oBtn
        ]
      });
      _stepPanels[action] = { panel: oPanel, btn: oBtn, press: fnPress };
      return new sap.m.VBox({ width: "260px", items: [ oPanel ] })
        .addStyleClass("sapUiSmallMarginEnd sapUiSmallMarginBottom");
    }

    var oStepBox = new sap.m.FlexBox({ wrap: sap.m.FlexWrap.Wrap, items: [
      makeStepCard("01", "sap-icon://download-from-cloud", "Data Ingestion",      "Collect TANK/MAT/MOV/PHYS/BOOK from SAP IS-Oil",             "triggerRun",              "Ingest",      false),
      makeStepCard("02", "sap-icon://validate",            "Data Validation",     "Completeness, referential integrity, consistency",           "validateData",            "Validate",    false),
      makeStepCard("03", "sap-icon://simulate",            "Balance Calculation", "Opening + Receipts − Issues − Consumption ± Transfers",      "calculateBalance",        "Calculate",   false),
      makeStepCard("04", "sap-icon://synchronize",         "Reconcile & Compare", "Plant / tank / material reconciliation, physical vs book",   "reconcileAndCompare",     "Reconcile",   false),
      makeStepCard("05", "sap-icon://alert",               "Tolerance Check",     "Assign INFO / ADVISORY / WARNING / CRITICAL severity",       "checkTolerances",         "Check Tol.",  false),
      makeStepCard("06", "sap-icon://search",              "Investigate & Classify","Root-cause: MC/TX/MD/TF/PL/SY (Slide 22)",               "investigateAndClassify",  "Investigate", false),
      makeStepCard("07", "sap-icon://document-text",       "Exception Report",    "Evidence package + corrective recommendations",              "generateExceptionReport", "Report",      false),
      makeStepCard("08", "sap-icon://manager-insight",     "Executive Summary",   "Management KPI dashboard with period-over-period trends",    "generateExecutiveSummary","Summary",     false),
      makeStepCard("★",  "sap-icon://process",             "Run Full Pipeline",   "Trigger a new run and execute all steps end-to-end",         "runFullPipeline",         "New Run",     true)
    ]});

    return new sap.m.VBox({ items: [
      new sap.m.Toolbar({ content: [
        new sap.m.Title({ text: "Agentic Pipeline — Step-by-Step Execution", level: sap.ui.core.TitleLevel.H2 }),
        new sap.m.ToolbarSpacer(),
        new sap.m.Button({ icon: "sap-icon://refresh", tooltip: "Refresh runs", press: function() { loadAll(); } })
      ]}),
      new sap.m.Panel({ headerText: "Select Run to Execute Steps", expandable: false, content: [
        new sap.m.HBox({ alignItems: sap.m.FlexAlignItems.Center, items: [
          new sap.m.Label({ text: "Active Run:" }).addStyleClass("sapUiSmallMarginEnd"),
          oRunSel,
          new sap.m.Button({
            text: "Trigger New Run", type: sap.m.ButtonType.Emphasized, icon: "sap-icon://play",
            press: function() { openTriggerDialog(); }
          }).addStyleClass("sapUiSmallMarginBegin")
        ]})
      ]}).addStyleClass("sapUiSmallMarginBottom"),
      oStepBox
    ]});
  }

  // ─── MAIN APP SHELL ──────────────────────────────────────────────────────
  var oIconTabBar = new sap.m.IconTabBar({
    expandable: false,
    stretchContentHeight: false,
    items: [
      new sap.m.IconTabFilter({
        key: "dashboard",
        icon: "sap-icon://home",
        text: "Dashboard",
        content: [
          new sap.m.VBox({
            items: [
              buildKpiSection(),
              new sap.m.Text({
                text: "Mass Balance Runs — Recent",
                wrapping: false
              }).addStyleClass("section-header sapUiSmallMarginTop"),
              buildRunsPage()
            ]
          }).setModel(oModel)
        ]
      }),
      new sap.m.IconTabFilter({
        key: "runs",
        icon: "sap-icon://history",
        text: "All Runs",
        content: [ buildRunsPage().setModel(oModel) ]
      }),
      new sap.m.IconTabFilter({
        key: "exceptions",
        icon: "sap-icon://alert",
        text: "Exceptions",
        iconColor: sap.ui.core.IconColor.Negative,
        content: [ buildExceptionsPage().setModel(oModel) ]
      }),
      new sap.m.IconTabFilter({
        key: "approvals",
        icon: "sap-icon://pending",
        text: "Approvals",
        iconColor: sap.ui.core.IconColor.Critical,
        content: [ buildApprovalsPage().setModel(oModel) ]
      }),
      new sap.m.IconTabFilter({
        key: "config",
        icon: "sap-icon://settings",
        text: "Configuration",
        content: [ buildConfigPage().setModel(oModel) ]
      }),
      new sap.m.IconTabFilter({
        key: "pipeline",
        icon: "sap-icon://process",
        text: "Pipeline",
        content: [ buildAboutPage().setModel(oModel) ]
      })
    ]
  }).setModel(oModel);

  var oPage = new sap.m.Page({
    title: "Refinery Mass Balance — Agentic AI",
    showNavButton: false,
    headerContent: [
      new sap.m.Button({
        icon: "sap-icon://refresh",
        tooltip: "Refresh all data",
        press: loadAll
      }),
      new sap.m.ObjectStatus({
        text: "AI-Powered | 10-Step Pipeline | Human-in-the-Loop",
        state: "Information"
      }).addStyleClass("sapUiSmallMarginBegin")
    ],
    subHeader: new sap.m.Toolbar({
      content: [
        new sap.m.Label({ text: "Connected to: SAP CAP OData Service" }),
        new sap.m.ToolbarSeparator(),
        new sap.m.Label({ text: "Slide deck: SAP Refinery Mass Balance Reconciliation (Sept 2026)" }),
        new sap.m.ToolbarSpacer(),
        new sap.m.BusyIndicator({
          visible: "{/busy}",
          size: "0.75rem"
        }).setModel(oModel)
      ]
    }),
    content: [ oIconTabBar ]
  });

  var oApp = new sap.m.App({ pages: [ oPage ] });
  oApp.setModel(oModel);
  oApp.placeAt("content");

  // ─── initial load ─────────────────────────────────────────────────────────
  loadAll();
});
</script>
